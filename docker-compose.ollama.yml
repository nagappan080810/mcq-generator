# docker-compose.ollama.yml - Local development stack
#
# Ollama sidecar + MCQ Generator app on a shared bridge network.
# For production on SnapDeploy, deploy containers individually (see README.md).
#
# Usage:
#   docker compose -f docker-compose.ollama.yml up --build
#
# Test:
#   curl http://localhost:8080/hello
#   curl http://localhost:11434/api/tags

services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: ollama-sidecar
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MODEL=qwen2.5:0.5b
      - OLLAMA_CONTEXT_LENGTH=4096
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_FLASH_ATTENTION=1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  mcq-api:
    build:
      context: .
      dockerfile: Dockerfile.snapdeploy
    container_name: mcq-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OPENROUTER_BASE_URL=http://ollama:11434/v1
      - OPENROUTER_API_KEY=ollama
      - MCQ_MODEL=qwen2.5:0.5b
      - MCQ_PROVIDER=ollama
      - MCQ_TEMPERATURE=0.7
      - REDIS_URL=${REDIS_URL:-}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
