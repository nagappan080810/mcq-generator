# Server
server.port=${PORT:8080}

# ------------------------------------------------------------------
# Spring AI / OpenRouter (OpenAI-compatible endpoint)
# ------------------------------------------------------------------
# Base URL points to OpenRouter's OpenAI-compatible API.
spring.ai.openai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.chat.options.model=${MCQ_MODEL:openrouter/free}
spring.ai.openai.chat.options.temperature=${MCQ_TEMPERATURE:0.7}
spring.ai.openai.timeout=360s

# ------------------------------------------------------------------
# MCQ generator application defaults (overridable per request)
# ------------------------------------------------------------------
mcq.provider=${MCQ_PROVIDER:openrouter}
mcq.default-model=${MCQ_MODEL:openrouter/free}
mcq.temperature=${MCQ_TEMPERATURE:0.7}
mcq.job-ttl-hours=${MCQ_JOB_TTL_HOURS:24}

# ------------------------------------------------------------------
# Scheduler (hourly rolling sweep over the full question matrix)
# ------------------------------------------------------------------
# When enabled, every sweep dispatches one job per (jobTitle, technology, difficulty) combo.
mcq.scheduler.enabled=${MCQ_SCHEDULER_ENABLED:true}
# Wait for the app to be fully up before the first sweep.
mcq.scheduler.initial-delay-ms=${MCQ_SCHEDULER_INITIAL_DELAY_MS:60000}
# How often a sweep runs. fixedDelay = time after the previous sweep finishes.
mcq.scheduler.fixed-delay-ms=${MCQ_SCHEDULER_FIXED_DELAY_MS:3600000}
# The full matrix is split into this many slices. With 5 job titles x
# technologies x difficulties, 24 slices = a full refresh once per day.
mcq.scheduler.daily-slices=${MCQ_SCHEDULER_DAILY_SLICES:24}
# Questions asked to the AI per (jobTitle, technology, difficulty) combo.
mcq.scheduler.questions-per-tech=${MCQ_SCHEDULER_QUESTIONS_PER_TECH:10}
# Combinations to generate (must match tech-interview-topics-by-role.json levels).
mcq.scheduler.job-titles=${MCQ_SCHEDULER_JOB_TITLES:Junior-Developer,Mid-level-Developer,Senior-Developer,Lead,Architect}
mcq.scheduler.technologies=${MCQ_SCHEDULER_TECHNOLOGIES:java,core-dsa,system-design,react,react-nextjs,angular,node-backend,spring-boot,auth,design-patterns,twelve-factor,kubernetes}
mcq.scheduler.difficulties=${MCQ_SCHEDULER_DIFFICULTIES:Easy,Medium,Hard}

# ------------------------------------------------------------------
# Resilience4j — Circuit Breaker + Retry for AI calls
# ------------------------------------------------------------------
# Circuit Breaker: stop hammering OpenRouter when it's down
resilience4j.circuitbreaker.instances.aiProvider.sliding-window-size=10
resilience4j.circuitbreaker.instances.aiProvider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.aiProvider.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.aiProvider.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.aiProvider.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.aiProvider.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.aiProvider.register-health-indicator=true
resilience4j.circuitbreaker.instances.aiProvider.record-exceptions=java.io.IOException,java.util.concurrent.TimeoutException
# CircuitBreaker(1) wraps Retry(2) — Retry must be inner so all attempts count as one CB call
resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
resilience4j.retry.retry-aspect-order=2

# Retry: 3 attempts, 5s fixed delay between retries
resilience4j.retry.instances.aiProvider.max-attempts=3
resilience4j.retry.instances.aiProvider.wait-duration=5s

# ------------------------------------------------------------------
# Redis (Upstash)
# ------------------------------------------------------------------
# Upstash provides a REDIS_URL connection string:
#   rediss://default:<password>@<host>:<port>
# Spring Boot auto-configures TLS for rediss:// scheme.
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.timeout=${REDIS_TIMEOUT_MS:5000}
