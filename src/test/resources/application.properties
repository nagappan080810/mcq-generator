# Tests do not connect to a real Redis / OpenAI.
# Redis auto-config (imperative, reactive, repositories) is excluded so no real
# connection is attempted; the StringRedisTemplate used by the app is provided
# by @MockitoBean in the test classes.
spring.autoconfigure.exclude=\
  org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

# Avoid Spring AI trying to build a real OpenAI client during tests.
spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=http://localhost:9999

# Disable Resilience4j retries and circuit breaker in tests
resilience4j.retry.instances.aiProvider.max-attempts=1
resilience4j.circuitbreaker.instances.aiProvider.minimum-number-of-calls=100
resilience4j.circuitbreaker.instances.aiProvider.sliding-window-size=100
